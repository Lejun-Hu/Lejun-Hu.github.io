<!-- 页脚区域 -->
<footer class="site-footer">
  <div class="container">

    <!-- 社交媒体链接 -->
    <div class="social-links">
      {% if site.author.github %}
        <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">
          GitHub
        </a>
      {% endif %}

      {% if site.author.linkedin %}
        <a href="https://linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">
          LinkedIn
        </a>
      {% endif %}

      <a href="mailto:{{ site.author.email }}">Email</a>
    </div>

    <!-- 版权信息 -->
    <div class="footer-license">
      <p class="license-text">
        <span class="license-icon">©</span> {{ site.time | date: '%Y' }} {{ site.author.name }} · 保留所有权利
      </p>
      <p class="license-detail">
        本站内容未经作者书面同意，不得用于任何商业目的。
        欢迎以学习交流为目的的转发、改写与引用，请注明出处。
      </p>
    </div>

    <p class="copyright">
      使用 Jekyll & GitHub Pages 构建。
    </p>

  </div>
</footer>
